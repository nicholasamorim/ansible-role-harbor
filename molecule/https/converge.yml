---
- name: Converge the HTTPS Molecule scenario
  hosts: localhost
  gather_facts: false
  vars:
    molecule_ephemeral_directory: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
    scenario_root: "{{ molecule_ephemeral_directory }}/https"
    fake_docker_environment:
      PATH: "{{ scenario_root }}/bin:{{ lookup('env', 'PATH') }}"
      FAKE_DOCKER_LOG: "{{ scenario_root }}/fake-docker.log"
  environment: "{{ fake_docker_environment }}"
  tasks:
    - name: Include the role under test
      ansible.builtin.include_role:
        name: ansible-role-harbor
      vars:
        harbor_install_dir: "{{ scenario_root }}/install"
        harbor_become: false
        harbor_datadir: "{{ scenario_root }}/data"
        harbor_installer_archive: "{{ scenario_root }}/downloads/fake-harbor-installer.tgz"
        harbor_url: "file://{{ scenario_root }}/fake-harbor-offline-installer.tgz"
        harbor_hostname: "registry.example.test"
        harbor_ui_url_protocol: "https"
        harbor_exposed_https_port: 18443
        harbor_external_url: "https://registry.example.test:18443"
        harbor_ssl_cert: "{{ scenario_root }}/certs/server.crt"
        harbor_ssl_cert_key: "{{ scenario_root }}/certs/server.key"
