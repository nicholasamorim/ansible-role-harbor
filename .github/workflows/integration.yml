---
name: Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harbor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==2.19.*"

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run Harbor smoke test
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/..
        run: ansible-playbook -i .github/inventory/localhost.ini .github/playbooks/integration.yml

      - name: Tear down Harbor smoke environment
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/harbor-integration/install/harbor" ]; then
            cd "${RUNNER_TEMP}/harbor-integration/install/harbor"
            docker compose down -v || true
          fi
          sudo rm -rf "${RUNNER_TEMP}/harbor-integration"
