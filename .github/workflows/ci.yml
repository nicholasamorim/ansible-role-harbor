---
name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt "ansible-core==2.19.*"

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible content
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/..
        run: ansible-lint

      - name: Syntax-check role fixture playbook
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/..
        run: ansible-playbook -i tests/inventory --syntax-check tests/test.yml

  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - "2.17.*"
          - "2.19.*"
        scenario:
          - default
          - https
          - legacy-upgrade-guard
          - lifecycle
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Molecule dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt "ansible-core==${{ matrix.ansible-core }}"

      - name: Show Docker Compose version
        run: docker compose version

      - name: Run Molecule scenario
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/..
        run: molecule test -s "${{ matrix.scenario }}"
