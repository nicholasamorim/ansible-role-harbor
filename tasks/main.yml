---
- name: Check for legacy Harbor configuration
  ansible.builtin.stat:
    path: "{{ harbor_install_dir }}/harbor/harbor.cfg"
  register: harbor_legacy_config

- name: Check for current Harbor configuration
  ansible.builtin.stat:
    path: "{{ harbor_install_dir }}/harbor/harbor.yml"
  register: harbor_current_config

- name: Refuse unsupported direct upgrade from legacy Harbor
  ansible.builtin.fail:
    msg: >-
      Found a legacy Harbor installation that still uses harbor.cfg. Direct in-place
      upgrades from that layout to Harbor {{ harbor_version }} are not automated by this
      role because Harbor only supports multi-step upgrades across major releases.
      Upgrade Harbor separately first, or set harbor_allow_unsupported_upgrade=true
      if you intentionally want the role to attempt it anyway.
  when:
    - harbor_install | bool
    - harbor_legacy_config.stat.exists
    - not harbor_current_config.stat.exists
    - not harbor_allow_unsupported_upgrade | bool

- name: Detect docker compose command
  ansible.builtin.include_tasks: _detect_compose.yml
  when: harbor_install | bool

- name: Check whether requested Harbor installer was already unpacked
  ansible.builtin.stat:
    path: "{{ harbor_install_dir }}/.harbor-installer-{{ harbor_installer_type }}-{{ harbor_version }}"
  register: harbor_installer_marker
  when: harbor_install | bool

- name: Check whether Harbor was already installed
  ansible.builtin.stat:
    path: "{{ harbor_install_dir }}/harbor/harbor_install_log.txt"
  register: harbor_install_log
  when: harbor_install | bool

- name: Ensure Harbor install directory exists
  become: "{{ harbor_become | bool }}"
  ansible.builtin.file:
    path: "{{ harbor_install_dir }}"
    state: directory
    mode: "0755"
  when: harbor_install | bool

- name: Ensure Harbor installer archive directory exists
  become: "{{ harbor_become | bool }}"
  ansible.builtin.file:
    path: "{{ harbor_installer_archive | dirname }}"
    state: directory
    mode: "0755"
  when: harbor_install | bool

- name: Download Harbor installer
  become: "{{ harbor_become | bool }}"
  ansible.builtin.get_url:
    url: "{{ harbor_url }}"
    dest: "{{ harbor_installer_archive }}"
    mode: "0644"
    validate_certs: "{{ harbor_installer_validate_certs | bool }}"
  when: harbor_install | bool

- name: Unpack Harbor installer
  become: "{{ harbor_become | bool }}"
  ansible.builtin.command:
    argv:
      - tar
      - -xzf
      - "{{ harbor_installer_archive }}"
      - -C
      - "{{ harbor_install_dir }}"
  register: harbor_unpack
  changed_when: true
  when:
    - harbor_install | bool
    - not harbor_installer_marker.stat.exists

- name: Mark Harbor installer version as unpacked
  become: "{{ harbor_become | bool }}"
  ansible.builtin.file:
    path: "{{ harbor_install_dir }}/.harbor-installer-{{ harbor_installer_type }}-{{ harbor_version }}"
    state: touch
    mode: "0644"
  when:
    - harbor_install | bool
    - harbor_unpack is changed

- name: Ensure Harbor certificate directories exist
  become: "{{ harbor_become | bool }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ [harbor_ssl_cert | dirname, harbor_ssl_cert_key | dirname] | unique }}"
  when:
    - harbor_install | bool
    - harbor_ui_url_protocol == "https"
    - harbor_ssl_cert_self_sign | bool

- name: Generate self-signed certificate for Harbor
  become: "{{ harbor_become | bool }}"
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -newkey
      - rsa:4096
      - -nodes
      - -sha256
      - -keyout
      - "{{ harbor_ssl_cert_key }}"
      - -subj
      - "{{ harbor_ssl_self_subject }}"
      - -new
      - -x509
      - -days
      - "{{ harbor_ssl_self_days | string }}"
      - -out
      - "{{ harbor_ssl_cert }}"
  args:
    creates: "{{ harbor_ssl_cert }}"
  register: harbor_ssl_certificate
  when:
    - harbor_install | bool
    - harbor_ui_url_protocol == "https"
    - harbor_ssl_cert_self_sign | bool

- name: Render Harbor configuration
  become: "{{ harbor_become | bool }}"
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: "{{ harbor_install_dir }}/harbor/harbor.yml"
    mode: "0644"
  register: harbor_config
  when: harbor_install | bool

- name: Run Harbor installer
  become: "{{ harbor_become | bool }}"
  ansible.builtin.command: "./install.sh{{ harbor_installer_with }} {{ harbor_installer_extra_args }}"
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  changed_when: true
  when:
    - harbor_install | bool
    - harbor_unpack is changed or (not harbor_install_log.stat.exists)

- name: Regenerate Harbor runtime configuration
  become: "{{ harbor_become | bool }}"
  ansible.builtin.command: "./prepare{{ harbor_installer_with }}"
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  changed_when: true
  when:
    - harbor_install | bool
    - harbor_install_log.stat.exists
    - harbor_config.changed or (harbor_ssl_certificate.changed | default(false))

- name: Restart Harbor to apply configuration changes
  ansible.builtin.include_tasks: restart.yaml
  when:
    - harbor_install | bool
    - harbor_install_log.stat.exists
    - harbor_config.changed or (harbor_ssl_certificate.changed | default(false))

- name: Wait for Harbor API
  ansible.builtin.uri:
    url: "{{ harbor_api_url }}/projects?page=1&page_size=1"
    method: GET
    user: admin
    password: "{{ harbor_admin_password }}"
    force_basic_auth: true
    status_code: 200
    validate_certs: "{{ harbor_api_validate_certs | bool }}"
  register: harbor_api_ready
  retries: "{{ harbor_api_wait_retries | int }}"
  delay: "{{ harbor_api_wait_delay | int }}"
  until: harbor_api_ready.status == 200
  changed_when: false
  when:
    - harbor_projects | length > 0 or (harbor_users | length > 0 and harbor_self_registration | string | lower == "off")

- name: Create Harbor projects
  ansible.builtin.uri:
    url: "{{ harbor_api_url }}/projects"
    method: POST
    user: admin
    password: "{{ harbor_admin_password }}"
    status_code:
      - 201
      - 409
    body_format: json
    force_basic_auth: true
    return_content: true
    validate_certs: "{{ harbor_api_validate_certs | bool }}"
    body: "{{ lookup('template', 'templates/create_project.j2') }}"
  loop: "{{ harbor_projects }}"
  loop_control:
    label: "{{ item.project_name }}"
  when: harbor_projects | length > 0

- name: Create Harbor users
  ansible.builtin.uri:
    url: "{{ harbor_api_url }}/users"
    method: POST
    user: admin
    password: "{{ harbor_admin_password }}"
    status_code:
      - 201
      - 409
    body_format: json
    force_basic_auth: true
    return_content: true
    validate_certs: "{{ harbor_api_validate_certs | bool }}"
    body: "{{ lookup('template', 'templates/create_user.j2') }}"
  loop: "{{ harbor_users }}"
  loop_control:
    label: "{{ item.username }}"
  when:
    - harbor_users | length > 0
    - harbor_self_registration | string | lower == "off"
